name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Pytest
        run: python -m pytest -q

  no-venv:
    name: no virtual environment committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # .gitignore only knows the usual names.  pyvenv.cfg marks any venv, virtualenv
      # or uv environment whatever it is called, and site-packages/ catches conda ones.
      - name: Fail if a virtual environment is tracked
        run: |
          if git ls-files | grep -E '(^|/)(pyvenv\.cfg$|site-packages/)'; then
            echo "::error::A Python virtual environment is committed.  Untrack it with 'git rm -r --cached <dir>' and add the directory to .gitignore."
            exit 1
          fi
